# Dual-domain nginx (HTTP first; Certbot adds SSL).
#
# Install:
#   sudo cp deploy/nginx/dailydiet.conf /etc/nginx/sites-available/dailydiet
#   # edit root path under the web server block if needed
#   sudo ln -sf /etc/nginx/sites-available/dailydiet /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS A records → droplet IP:
#   diet.yayati-labs.com          (CF orange OK)
#   api.diet.yayati-labs.com      (keep CF grey / DNS only — Universal SSL
#                                  does not cover nested api.diet.*; else
#                                  browser ERR_SSL_VERSION_OR_CIPHER_MISMATCH)
#
# HTTPS:
#   sudo certbot --nginx -d diet.yayati-labs.com -d api.diet.yayati-labs.com
#
# Web build must use:
#   VITE_API_BASE_URL=https://api.diet.yayati-labs.com npm run build

# --- Web SPA ---
server {
    listen 80;
    listen [::]:80;
    server_name diet.yayati-labs.com;

    root /home/YOUR_USER/DailyDiet/apps/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- API (FastAPI on 127.0.0.1:3000) ---
server {
    listen 80;
    listen [::]:80;
    server_name api.diet.yayati-labs.com;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
