# Install:
#   sudo cp deploy/nginx/dailydiet.conf /etc/nginx/sites-available/dailydiet
#   sudo ln -sf /etc/nginx/sites-available/dailydiet /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then (with a DNS A record pointing here):
#   sudo certbot --nginx -d your.domain.com
#
# Set root to the absolute path of apps/web/dist on this droplet.

server {
    listen 80;
    listen [::]:80;
    server_name your.domain.com;

    root /home/YOUR_USER/DailyDiet/apps/web/dist;
    index index.html;

    client_max_body_size 6m;

    # API + static uploads (FastAPI)
    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # Optional: API docs (remove in hardened prod if you prefer)
    location /docs {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
